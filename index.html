    <!--
      Google Fonts — variable-font editions for maximum weight precision.

      TWK Lausanne substitute  → Inter (wght 100–900 variable)
        • Weights in use: 200 (light body), 350 (body-sm), 400 (body),
          550 (micro-labels / buttons / nav), 700 (wordmark)
        • Tracking: +0.01em uppercase labels; -0.02em mid; -0.04em display

      PP Mondwest substitute   → Cormorant (wght 300–700 variable, upright)
        • Weight in use: 400 only, line-height 0.9, tracking -0.04em
        • Sizes: 60px → 165px → 295px (scaled via clamp)

      Editorial New substitute → Cormorant Italic (wght 300, italic)
        • Weight in use: 300, italic, line-height 0.9, tracking -0.02em
        • Used for italic-leaning editorial passages (testimonials, pull-quotes)

      Times → system Times New Roman (no Google Fonts needed)
        • 16px / 400 / line-height 1.2 — footer links, underlined body text
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Aboreto&family=Syne:wght@400..800&display=swap"

    />
